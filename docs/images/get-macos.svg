  </g>
  <!-- Title & subtitle -->
  <text x="54" y="24.5" fill="#2E1C11" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" letter-spacing="-0.2">macOS</text>
  <text x="54" y="39.5" fill="#846E5C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="500">Apple Silicon</text>
  <!-- Right circular download indicator -->
  <circle cx="180" cy="26" r="12" fill="#E66922" fill-opacity="0.11"/>
  <path d="M180 21.4V28.1M180 28.1L177.2 25.4M180 28.1L182.8 25.4M176.2 30.3H183.8" stroke="#DC601B" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
