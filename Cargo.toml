[package]
name = "echo"
version = "0.0.3"
edition = "2024"
license = "AGPL-3.0-only"
description = "Echo — an offline desktop app for organizing documents and canvases in spaces"

[dependencies]
rune = { path = "vendor/rune/crates/rune", default-features = false, features = ["svg", "metal-backend", "native-file-dialog", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rune-kit = { path = "vendor/rune/crates/rune-kit", features = ["markdown", "mermaid"] }
rune-mermaid = { path = "vendor/rune/crates/rune-mermaid" }
rune-fx = { path = "vendor/rune/crates/rune-fx" }
wgpu = { version = "30", default-features = false, features = ["std", "metal", "wgsl"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Enable dictionary segmentation for Chinese text, including word selection.
parley = { version = "0.12", default-features = false, features = ["std", "complex-scripts"] }
roxmltree = "0.21"
minisign-verify = "0.3"
tempfile = "3"
ratex-parser = "=0.1.16"
ratex-layout = "=0.1.16"
ratex-types = "=0.1.16"
ratex-svg = { version = "=0.1.16", features = ["embed-fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
libc = "0.2"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0
[profile.dev.package."*"]
opt-level = 1
[profile.release]
codegen-units = 16
strip = true
