name: Windows
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: pwsh
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure the official update source for release candidates
        if: github.repository == 'JOYCEQL/Echo' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $PublicKey = (Get-Content packaging/echo-update.pub)[1]
          if ([Convert]::FromBase64String($PublicKey).Length -ne 42) { throw 'Invalid Echo update public key' }
          "ECHO_UPDATE_PUBLIC_KEY=$PublicKey" >> $env:GITHUB_ENV
          "ECHO_UPDATE_REPOSITORY=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" >> $env:GITHUB_ENV
      - name: Build portable zip and per-user installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Installer
      - name: Verify install and uninstall with a Unicode path
        shell: pwsh
        run: |
          $Setup = (Get-ChildItem dist/Echo-*-windows-x64-setup.exe).FullName
          $InstallDir = Join-Path $env:RUNNER_TEMP 'Echo 中文安装'
          $Process = Start-Process $Setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$InstallDir`"" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Setup failed: $($Process.ExitCode)" }
          if (-not (Test-Path "$InstallDir/Echo.exe")) { throw 'Installed executable missing' }
          $Process = Start-Process "$InstallDir/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Uninstall failed: $($Process.ExitCode)" }
          if (Test-Path "$InstallDir/Echo.exe") { throw 'Executable was not uninstalled' }
      - uses: actions/upload-artifact@v4
        with:
          name: Echo-windows-x64
          path: |
            dist/Echo-*-windows-x64.zip
            dist/Echo-*-windows-x64-setup.exe
          if-no-files-found: error
