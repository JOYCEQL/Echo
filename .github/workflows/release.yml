name: Publish release
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-release-publication
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'JOYCEQL/Echo' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, source version and main history
        run: |
          test "v$(python3 scripts/bump_version.py --check)" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - name: Test release tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python3 -m unittest discover -s scripts -p 'test_*.py'
  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
  publish:
    needs: [macos, windows]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Echo-*
          path: dist
          merge-multiple: true
      - name: Prepare signing tools and source archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python3 -m venv "$RUNNER_TEMP/echo-python"
          "$RUNNER_TEMP/echo-python/bin/pip" install 'boto3>=1.39,<2'
          python3 scripts/package_source.py
      - name: Sign and publish all platforms to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          umask 077
          export MINISIGN_SECRET_KEY="$RUNNER_TEMP/echo-minisign.key"
          trap 'rm -f "$MINISIGN_SECRET_KEY"' EXIT
          printf '%s\n' "$MINISIGN_KEY" > "$MINISIGN_SECRET_KEY"
          unset MINISIGN_KEY
          "$RUNNER_TEMP/echo-python/bin/python" scripts/publish_downloads.py release macos-arm64 macos-x86_64 windows-x64
      - name: Verify public feeds after CDN propagation
        run: |
          for attempt in {1..7}; do
            if python3 scripts/verify_downloads.py "${GITHUB_REF_NAME#v}" macos-arm64 macos-x86_64 windows-x64; then exit 0; fi
            if [ "$attempt" -lt 7 ]; then sleep 50; fi
          done
          exit 1
      - name: Publish the verified archive on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_github.py "$GITHUB_REF_NAME"
