name: macOS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared release version and version tooling
        run: |
          python3 scripts/bump_version.py --check
          python3 -m unittest discover -s scripts -p 'test_bump_version.py'
      - name: Install Rust toolchain
        run: |
          rustup show
          test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked -- --test-threads=1
      - name: Build and verify macOS app ZIP
        run: bash scripts/build-macos.sh
      - name: Build Intel release packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          rustup target add x86_64-apple-darwin
          bash scripts/release.sh x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Echo-macos
          path: |
            dist/Echo-*-macos-*.zip
            dist/Echo-*-macos-*.zip.sha256
            dist/Echo-*-macos-*.dmg
            dist/Echo-*-macos-*.dmg.sha256
          if-no-files-found: error
