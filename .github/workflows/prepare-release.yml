name: Prepare release

on:
  workflow_dispatch:
    inputs:
      part:
        description: Version part to increment
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: echo-prepare-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version updates
        run: python -m unittest discover -s scripts -p 'test_bump_version.py'
      - name: Prepare shared release version
        id: version
        env:
          VERSION_PART: ${{ inputs.part }}
        run: |
          VERSION=$(python scripts/bump_version.py --part "$VERSION_PART" --dry-run)
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi
          python scripts/bump_version.py --part "$VERSION_PART"
          git diff --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and tag version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock packaging/Info.plist packaging/windows/Echo.manifest README.md
          git commit -m "chore(release): bump version to $RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"
          {
            echo "## Echo $RELEASE_VERSION"
            echo "Version references updated and tagged as v$RELEASE_VERSION."
            echo "Build both macOS and Windows from this tag; neither build increments the version again."
            echo "This workflow prepares the version; it does not publish a GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
