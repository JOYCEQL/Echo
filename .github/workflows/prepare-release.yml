name: Prepare release

on:
  workflow_dispatch:
    inputs:
      part:
        description: Version part to increment
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  actions: write

concurrency:
  group: echo-prepare-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version and release publication
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare shared release version
        id: version
        env:
          VERSION_PART: ${{ inputs.part }}
        run: |
          VERSION=$(python scripts/bump_version.py --part "$VERSION_PART" --dry-run)
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi
          python scripts/bump_version.py --part "$VERSION_PART"
          git diff --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and tag version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock packaging/Info.plist packaging/windows/Echo.manifest
          git commit -m "chore(release): bump version to $RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"
      - name: Publish the prepared tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref "$TAG"
